name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build online APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Run unit tests and build the online APK
        run: ./gradlew testOnlineDebugUnitTest assembleOnlineDebug --no-daemon

      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-harness-optimized-online-debug
          path: app/build/outputs/apk/online/debug/app-online-debug.apk
          if-no-files-found: error
          retention-days: 30
